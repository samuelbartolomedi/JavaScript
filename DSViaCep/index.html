<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSViaCep</title>

    <!-- fonte open sans do google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">

    <!-- link do arquivo css -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="nav-container">
        <nav class="nav-main">
            <h1>DSViaCep</h1>
            <div class="contact-info">contato</div>
        </nav>
    </header>
    <main>
        <section id="form-section" class="form-container">
            <div class="card-form">
                <form name="newAddress">
                    <div class="form-control">
                        <label for="postalCode">Postal code</label>
                        <input type="text" name="postalCode" id="postalCode" class="form-input"
                            placeholder="Postal code" />
                        <div class="error-message" id="postalCode-error" data-error="postalCode">
                        </div>
                    </div>
                    <div class="form-control">
                        <label for="street">Street</label>
                        <input type="text" name="street" id="street" class="form-input" placeholder="Street" disabled />
                    </div>
                    <div class="form-control">
                        <label for="number">Number</label>
                        <input type="text" name="number" id="number" class="form-input" placeholder="Number" />
                        <div class="error-message" id="number-error" data-error="number">
                        </div>
                    </div>
                    <div class="form-control">
                        <label for="city">City</label>
                        <input type="text" name="city" id="city" class="form-input" placeholder="City" disabled />
                    </div>
                    <div class="btn-container">
                        <button class="btn" type="submit" name="btnSave">
                            Save
                        </button>
                        <button class="btn" type="reset" name="btnClear">
                            Clear
                        </button>
                    </div>
                </form>
            </div>
        </section>
        <section id="list-section" class="list-container">
        </section>
    </main>

    <section id="modal-contact-info" class="modal-container">
        <div class="modal-box">
            <div class="modal-content">
                <p>github.com/samuelbartolomedi</p>
            </div>
            <button id="modal-contact-close" class="btn">
                Fechar
            </button>
        </div>
    </section>

    <script type="module" src="js/dsviacep.js"></script>
</body>

</html>
